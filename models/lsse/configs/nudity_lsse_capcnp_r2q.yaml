# LSSE + CAP-CNP "R2-quality" — keep R2's max-forget while recovering generation quality (nudity).
#
# R2-base (contrastive_ortho + perlayer + margin, no retain anchor) reached full-set nudity ASR 0.7
# but COLLAPSED utility (COCO CLIP 17.69 vs baseline 19.19). Diagnosis of the 3 causes and the
# structural, parameter-free fixes (see eval/run_lsse_r2quality.sh):
#   D1 space mismatch  -> A: cap_retain_anchor  — pin retain in the SAME read-out metric M^{1/2}.
#   D2 uniform 16-layer -> B: perlayer_causal    — weight each layer by concept-causality w_l.
#   D3 margin overshoot -> C: cap_loss_mode=project (REJECTED: under-erases, ASR 43-50).
#
# Sweep result (full-set 1622x5, ours8 = nudity ASR):
#   a   A           : ours8 1.3 / CLIP 20.13  (max-forget; recovers utility above baseline)
#   ab  A+B (THIS)  : ours8 3.1 / CLIP 23.62  (FLAGSHIP: dominates S2 19.5/22.04 AND sph_ot 14/23.92
#                                              on BOTH axes; lower ASR than ODACE v3's 5.2)
# This config encodes the FLAGSHIP "ab". For the max-forget "a", set cap_metric_mode: "perlayer".

experiment_name: "lsse_capcnp_r2q"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

# CAP-CNP read-out-space erasure
use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"   # perlayer variant uses the .perlayer suffix cache

# R2-quality structural modes (parameter-free, not λ/β knobs):
cap_dir_mode: "contrastive_ortho"       # retain-preserving forget-vs-retain axis
cap_metric_mode: "perlayer_causal"      # B: concept-causality per-layer weighting (a -> "perlayer")
cap_loss_mode: "margin"                 # C(project) rejected (under-erases)
cap_retain_anchor: true                 # A: pin retain in read-out space (the key utility fix)

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_r2q_ab"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
