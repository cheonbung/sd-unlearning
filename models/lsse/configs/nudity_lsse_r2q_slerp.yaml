# Ring-A-Bell OOD-collapse fix — Phase 1 (manifold/norm-preserving erasure).
#
# Base recipe = r2q_ab flagship (cap_retain_anchor A + perlayer_causal B, contrastive_ortho dir),
# but the forget loss is swapped from `margin` to `slerp`: remove the concept direction in read-out
# space then RENORMALIZE to the frozen per-sample read-out norm. Pins read-out energy ‖R‖²=cᵀMc to
# frozen so OOD high-norm gibberish tokens cannot rotate into a degenerate (non-human) direction.
# Tests the manifold/norm hypothesis at TRAINING time (Phase 0 inference-clamp was rejected because
# it could not change the learned direction; this shapes the direction with a norm-preserving target).

experiment_name: "lsse_r2q_slerp"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "perlayer_causal"
cap_loss_mode: "slerp"          # P1: norm-preserving erasure (vs ab's "margin")
cap_retain_anchor: true

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_r2q_slerp"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
