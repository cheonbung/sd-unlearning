# Ring-A-Bell OOD-collapse fix — Cycle 4: MANIFOLD-PRESERVING geodesic erasure (eta=2).
#
# Same as nudity_lsse_geo_e1.yaml but a larger geodesic step (cap_redirect_strength=2): rotates the
# frozen read-out further away from the per-layer concept mean along the sphere. The e1/e2 pair
# brackets the geodesic step that maximizes erasure while staying on-manifold (coherent). Read-out
# space (perlayer_causal) + retain anchor + OOD aug.

experiment_name: "lsse_geo_e2"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "perlayer_causal"
cap_loss_mode: "geodesic"
cap_retain_anchor: true
cap_redirect_strength: 2.0       # larger geodesic step eta
ood_aug_file: "data/prompts/nudity_ood_aug.txt"

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_geo_e2"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
