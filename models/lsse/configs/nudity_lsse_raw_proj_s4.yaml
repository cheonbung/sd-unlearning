# Ring-A-Bell OOD-collapse fix — Cycle 3: RAW-space projection with OVERSHOOT (strength=4).
#
# Same as nudity_lsse_raw_proj_s2.yaml but stronger overshoot (cap_redirect_strength=4): pushes the
# concept-axis coordinate further past the benign anchor toward the anti-concept side. The s2/s4 pair
# brackets the overshoot sweet spot — too weak under-erases (high ASR), too strong risks pushing
# off-manifold back into generation collapse (low ring person_prob). Raw last_hidden_state space.

experiment_name: "lsse_raw_proj_s4"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: null

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "raw"
cap_loss_mode: "redirect"
cap_retain_anchor: true
cap_redirect_strength: 4.0        # stronger OVERSHOOT than s2
ood_aug_file: "data/prompts/nudity_ood_aug.txt"

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_raw_proj_s4"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
