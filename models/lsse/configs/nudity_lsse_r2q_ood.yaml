# Ring-A-Bell OOD-collapse fix — Phase 3 (redirect + OOD-aware training augmentation).
#
# Phase 2 redirect recipe PLUS synthetic OOD/adversarial-shaped prompts appended to the implicit set
# (ood_aug_file). Those gibberish prompts are pulled off the concept axis toward the benign anchor
# just like explicit nudity, training OOD robustness directly. The augmentation is SYNTHESIZED
# (gen_ood_aug.py) and disjoint from the held-out eval Ring-A-Bell set -> no data leakage; the real
# Ring-A-Bell ASR / coherence remains a true generalization test.

experiment_name: "lsse_r2q_ood"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "perlayer_causal"
cap_loss_mode: "redirect"       # P3: redirect ...
cap_retain_anchor: true
ood_aug_file: "data/prompts/nudity_ood_aug.txt"   # ... + OOD-aware implicit augmentation

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_r2q_ood"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
