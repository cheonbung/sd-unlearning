# LSSE + CAP-CNP "R2q-a" (max-forget) applied to VIOLENCE — transfer of the nudity R2q-a recipe.
# R2q-a = R2q-ab with cap_metric_mode "perlayer" (plain, NOT causal): A (read-out retain anchor)
# without B (causal per-layer weighting). Nudity: ours8 1.3 / CLIP 20.13 (max-forget point).
# Eval: models/fcf/eval_violence_q16.py (Q16 unsafe-image classifier).

experiment_name: "lsse_capcnp_r2q_a_violence"
target_concept: "violence"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "perlayer"      # R2q-a identity: plain perlayer, NOT causal
cap_loss_mode: "margin"
cap_retain_anchor: true

explicit_prompts_file:  "data/prompts/violence_explicit.txt"
retain_prompts_file:    "data/prompts/violence_maintain.txt"
implicit_concepts_file: "data/prompts/violence_implicit.txt"

output_dir: "outputs/lsse_r2q_a_violence"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
