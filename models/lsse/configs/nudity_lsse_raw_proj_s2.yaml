# Ring-A-Bell OOD-collapse fix — Cycle 3: RAW-space projection with OVERSHOOT (strength=2).
#
# Read-out-space coordinate redirect (Stage-1/2/Cycle-2) could not erase while staying coherent
# (coherence↔ASR monotonic anti-correlated). New mechanism: erase in the RAW last_hidden_state space
# (cap_metric_mode=raw -> M^1/2=I, the FCF-P space, no UNet read-out reweighting) and OVERSHOOT the
# concept-axis coordinate PAST the benign anchor toward the anti-concept side (cap_redirect_strength=2)
# — a strong FCF-P-style projection rather than a gentle nudge to the benign mean. retain anchor (raw)
# + OOD aug keep coherence/utility. Goal: low ASR AND high ring person_prob (break the tension).

experiment_name: "lsse_raw_proj_s2"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: null              # raw mode: no UNet metric needed

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "raw"            # M^1/2 = I -> erase in raw last_hidden_state (FCF-P space)
cap_loss_mode: "redirect"
cap_retain_anchor: true
cap_redirect_strength: 2.0        # OVERSHOOT past benign (strength>1)
ood_aug_file: "data/prompts/nudity_ood_aug.txt"

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_raw_proj_s2"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
