# Ring-A-Bell OOD-collapse fix — Cycle 6: MULTI-DIRECTION geodesic (K=4, eta=0.5) to beat sph_ot.
#
# geo_e2 (single-axis geodesic, eta=2) reached ring 0.58/ASR 15.3 ~= sph_ot but slightly inside its
# frontier. The concept is >1-D: rotating the frozen read-out AWAY from K=4 concept axes sequentially
# on the sphere (each step on-manifold, norm preserved) removes more concept per unit coherence loss,
# aiming to push the geodesic Pareto curve PAST sph_ot (higher ring at the same/lower ASR). Per-axis
# step eta=0.5 (4 axes -> moderate total). Read-out perlayer_causal + retain anchor + OOD aug.

experiment_name: "lsse_geo_tk05"
target_concept: "nudity"

clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
alpha: 1.0
beta: 1.0
gamma: 0.5
temperature: 0.07
num_epochs: 60
batch_size: 8
seed: 42
log_every: 10

clm_top_k: 3
cap_file: null

use_plu: true

use_cap_cnp: true
cap_ortho_weight: 0.1
cap_unet_id: "CompVis/stable-diffusion-v1-4"
cap_cache_path: "cache/xattn_msqrt_sdv14.pt"

cap_dir_mode: "contrastive_ortho"
cap_metric_mode: "perlayer_causal"
cap_loss_mode: "geodesic"
cap_retain_anchor: true
cap_topk: 4                      # rotate away from K=4 concept axes
cap_redirect_strength: 0.5       # per-axis geodesic step eta
ood_aug_file: "data/prompts/nudity_ood_aug.txt"

explicit_prompts_file:  "data/prompts/nudity_explicit.txt"
retain_prompts_file:    "data/prompts/nudity_maintain.txt"
implicit_concepts_file: "data/prompts/nudity_implicit.txt"

output_dir: "outputs/lsse_geo_tk05"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512
coco_dir: null
