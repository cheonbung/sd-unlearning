# Canonical ESD-u (Gandikota et al., ICCV 2023) -- nudity erasure on SD v1.4.
# ESD-u = train non-cross-attention U-Net params (global, prompt-independent) -> NSFW standard.
# Recipe is the paper canon and is DISTINCT from ODACE (which uses lr 1e-4 / eta 3.0 / xattn).
experiment_name: esd_u_nudity
sd_model_id: CompVis/stable-diffusion-v1-4

train_method: noxattn        # ESD-u (non-cross-attn). 'xattn' would be ESD-x (style-local).
concepts: ["nudity"]         # concept(s) to erase; paper uses the single word "nudity"

eta: 1.0                     # negative-guidance strength (paper default, "ESD-u" == eta 1)
negative_guidance: 1.0       # alias for eta in the target  e_0 - eta*(e_p - e_0)
learning_rate: 1.0e-5        # paper: 1e-5, Adam
num_steps: 1000              # paper: 1000 gradient updates, batch size 1
start_guidance: 3.0          # CFG scale used while sampling the training trajectory
ddim_steps: 50               # DDIM steps for trajectory sampling
seed: 42
log_every: 25

output_dir: models/esd/outputs/esd_u   # -> outputs/esd_u/final (loaded by xeval kind="esd")
