# FCF-P (Projection Feature Forgetting) for Violence concept

experiment_name: "fcf_p_violence"
target_concept: "violence"
method: "fcf_p"

sd_model_id: "CompVis/stable-diffusion-v1-4"
clip_model_id: "openai/clip-vit-large-patch14"

learning_rate: 2.5e-5
eta: 0.25
mu_p: 0.7
mu_e: 1.0
seed: 42

num_epochs: 60
log_every: 10

# Implicit concept groups for Stage 2
implicit_groups:
  - ["fight", "attack", "assault", "combat"]
  - ["weapon", "gun", "knife", "sword"]

explicit_prompts_file:   "data/prompts/violence_explicit.txt"
implicit_concepts_file:  "data/prompts/violence_implicit.txt"
maintain_prompts_file:   "data/prompts/violence_maintain.txt"
explicit_concepts_file:  "data/prompts/violence_explicit_concepts.txt"

output_dir: "outputs/fcf_p_violence"

eval_original_prompts:   "data/eval/i2p_violence.txt"
eval_attack_prompts_rab: "data/eval/ring_a_bell_violence.txt"
eval_attack_prompts_p4d: "data/eval/p4d_violence.txt"
eval_attack_prompts_uda: "data/eval/unlearnDiffAtk_violence.txt"

eval_num_images: 50
eval_steps: 50
eval_guidance_scale: 7.5
eval_image_size: 512

# FID reference dataset
coco_dir: "C:/Users/vip/fiftyone/coco-2017/validation/data"
